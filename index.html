<style>
*{margin:0;padding:0;box-sizing:border-box;}
body{font-family:'Segoe UI','Microsoft YaHei',sans-serif;background:#0f1220;color:#e8ecf4;padding:12px 14px;}
td.price-diff{color:#ffe066 !important;font-weight:700;}
.header{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px;margin-bottom:10px;}
.header h1{font-size:19px;font-weight:700;background:linear-gradient(90deg,#ff4757,#ffa502);-webkit-background-clip:text;-webkit-text-fill-color:transparent;}
.date-selector{display:flex;align-items:center;gap:8px;background:#1a1f33;padding:4px 10px;border-radius:16px;border:1px solid #2a3150;}
.date-selector label{font-size:12px;color:#9aa3bd;white-space:nowrap;}
.date-selector input[type=date]{background:#1f2540;border:1px solid #2a3150;color:#e8ecf4;border-radius:8px;padding:4px 10px;font-size:12px;outline:none;color-scheme:dark;}
.date-selector input[type=date]:focus{border-color:#ff4757;}
.kpi-grid{display:grid;grid-template-columns:repeat(6,1fr);gap:8px;margin-bottom:10px;}
.kpi{background:linear-gradient(145deg,#181d33,#12162a);border:1px solid #252c4a;border-radius:10px;padding:7px 10px;position:relative;overflow:hidden;min-height:54px;display:flex;flex-direction:column;justify-content:center;}
.kpi::before{content:'';position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--c,#ff4757);}
.kpi .label{font-size:11px;color:#9aa3bd;margin-bottom:2px;line-height:1.15;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.kpi .value{font-size:16px;font-weight:700;line-height:1.15;}
.kpi .sub{font-size:10px;color:#6b7490;margin-top:1px;line-height:1.15;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.filter-bar{display:flex;flex-wrap:nowrap;gap:8px;align-items:center;margin-bottom:8px;background:#161a2e;border:1px solid #232a48;border-radius:10px;padding:6px 10px;overflow-x:auto;}
.filter-bar label{font-size:12px;color:#9aa3bd;white-space:nowrap;}
.filter-bar select,.filter-bar input{background:#1f2540;border:1px solid #2a3150;color:#e8ecf4;border-radius:8px;padding:4px 9px;font-size:12px;outline:none;flex:0 0 auto;}
.filter-bar select:focus,.filter-bar input:focus{border-color:#ff4757;}
.btn{background:linear-gradient(90deg,#ff4757,#ff6348);border:none;color:#fff;padding:4px 10px;border-radius:7px;cursor:pointer;font-size:12px;font-weight:600;flex:0 0 auto;}
.btn.reset{background:#2a3150;}
.result-info{font-size:12px;color:#9aa3bd;margin-bottom:6px;}
.table-card{background:#161a2e;border:1px solid #232a48;border-radius:10px;padding:10px 12px;}
.table-card h3{font-size:13px;margin-bottom:6px;color:#fff;display:flex;align-items:center;gap:8px;}
.table-card h3 span.dot{width:6px;height:6px;border-radius:50%;background:#ff4757;display:inline-block;}
.tbl-scroll{overflow:auto;max-height:72vh;border:1px solid #232a48;border-radius:8px;}
table{border-collapse:separate;border-spacing:0;width:2700px;min-width:2700px;font-size:11px;}
td{cursor:pointer;}
thead th{position:sticky;top:0;background:#1f2540;color:#fff;height:30px;min-height:30px;max-height:30px;padding:4px 8px;text-align:center;border-bottom:2px solid #2a3150;z-index:2;white-space:nowrap;cursor:pointer;user-select:none;box-sizing:border-box;}
/* 固定前两行：第1行表头 top:0（高30px），第2行总计 top:30px */
#total-row{position:sticky;top:30px;z-index:2;background:linear-gradient(135deg,#e6b800,#d4a017);}
#total-row th{position:static;background:linear-gradient(135deg,#e6b800,#d4a017);color:#12162a;height:30px;min-height:30px;max-height:30px;padding:4px 8px;text-align:center;border-bottom:2px solid #b89400;box-sizing:border-box;font-weight:800;}
.hl{background:rgba(0,206,201,0.20)!important;color:#00ffd5!important;font-weight:800;}
thead th:hover{background:#263052;}
/* 第1列「排序」左侧固定 */
th:nth-child(1),td:nth-child(1){position:sticky;left:0;width:56px;min-width:56px;max-width:56px;z-index:6;background:#161a2e;}
tbody tr:hover td:nth-child(1){background:#1c2240;}
/* 第1列同时固定前两行：表头格 top:0、总计格 top:30px，横向 left:0；层级高于普通表头/总计格 */
thead th:nth-child(1){top:0;left:0;background:#1f2540;z-index:8;}
#total-row th:nth-child(1){position:sticky;top:30px;left:0;background:linear-gradient(135deg,#e6b800,#d4a017);z-index:8;}
th:nth-child(2),td:nth-child(2){width:80px;min-width:80px;max-width:80px;}
th:nth-child(3),td:nth-child(3){width:115px;min-width:115px;max-width:115px;}
th:nth-child(4),td:nth-child(4){width:130px;min-width:130px;max-width:130px;}
/* 列固定已取消：所有列跟随横向滚动（宽度照旧） */
/* 所有列均跟随横向滚动，不做固定 */
th:nth-child(5),td:nth-child(5){width:135px;min-width:135px;max-width:135px;}
th:nth-child(6),td:nth-child(6){width:175px;min-width:175px;max-width:175px;}
/* 表头与数据统一左对齐 */
thead th{text-align:left;}
#total-row th{text-align:left;}
tbody td.num{text-align:left;}
tbody td{padding:2px 8px;border-bottom:1px solid #1c2238;text-align:left;white-space:nowrap;}
tbody td.num{text-align:left;font-variant-numeric:tabular-nums;}
tbody tr:hover{background:#1c2240;}
/* 缩放按钮 */
.zoom-box{position:fixed;left:14px;bottom:14px;display:flex;align-items:center;gap:6px;background:#1a1f33;border:1px solid #2a3150;border-radius:20px;padding:4px 8px;z-index:99;box-shadow:0 4px 14px rgba(0,0,0,.5);opacity:.92;}
.zoom-box:hover{opacity:1;}
.zoom-box button{background:#2a3150;border:none;color:#e8ecf4;width:24px;height:24px;border-radius:50%;cursor:pointer;font-size:13px;font-weight:700;line-height:1;display:flex;align-items:center;justify-content:center;}
.zoom-box button:hover{background:#ff4757;color:#fff;}
.zoom-box .zval{font-size:11px;color:#9aa3bd;min-width:36px;text-align:center;font-variant-numeric:tabular-nums;}
#zoom-wrap{zoom:0.91;}
.empty{text-align:center;color:#6b7490;padding:16px;}
.no-data{text-align:center;color:#ffa502;padding:40px;font-size:14px;}
.footer{margin-top:10px;text-align:center;color:#5a6280;font-size:11px;}
.note{background:#1a1f33;border-left:3px solid #ffa502;padding:6px 10px;border-radius:6px;font-size:11px;color:#c6cede;margin-bottom:8px;}
#copyToast{position:fixed;left:50%;top:78px;transform:translateX(-50%) translateY(-8px);background:linear-gradient(135deg,#00c9c0,#0aa39c);color:#04201f;font-weight:800;font-size:14px;padding:10px 22px;border-radius:10px;box-shadow:0 8px 26px rgba(0,201,192,.45);opacity:0;pointer-events:none;transition:all .18s ease;z-index:9999;white-space:nowrap;}
#copyToast.show{opacity:1;transform:translateX(-50%) translateY(0);}
</style>

let DEFAULT_DATE="2026-11-02";

let CURRENT_DATE=DEFAULT_DATE;
let LATEST_DATE=Object.keys(META).sort().pop();
let CURRENT_RECORDS=(META[CURRENT_DATE]?META[CURRENT_DATE].records:makeEmptySnapshot().records);
let HEADERS=(META[CURRENT_DATE]?META[CURRENT_DATE].headers.slice():makeEmptySnapshot().headers);
let sortIdx=-1,sortDir=1;

function makeEmptySnapshot(){
  const src=META[LATEST_DATE];
  const headers=src.headers.slice();
  const textCols=new Set(['类别','物料号','SKU','系列','配置','定位']);
  const records=src.records.map(r=>{
    const nr={};
    headers.forEach(h=>{
      if(textCols.has(h)){ nr[h]=r[h]!==undefined?r[h]:''; }
      else if(h==='周转'){ nr[h]='0.0'; }
      else if(h==='上月'||h==='10月'||h==='建议零售价'||h==='限时活动价'){ nr[h]='0'; }
      else { nr[h]='0'; }
    });
    nr['_seq']=(r['物料号']==='总计'||r['SKU']==='总计')?null:r['_seq'];
    return nr;
  });
  return {headers,records,fromEmpty:true};
}

function buildHeader(){
  const tr=document.getElementById('thead');
  tr.innerHTML='';
  const seqTh=document.createElement('th');
  seqTh.textContent='排序';
  seqTh.style.width='56px';
  seqTh.title='点击恢复Excel原始顺序';
  seqTh.onclick=function(){sortSeq();};
  tr.appendChild(seqTh);
  HEADERS.forEach((h,i)=>{
    const th=document.createElement('th');
    if(h==='目前可售')th.classList.add('hl');
    th.textContent=h;
    th.onclick=function(){toggleSort(i);};
    tr.appendChild(th);
  });
  renderTotalRow();
}

function buildFilters(){
  const rows=CURRENT_RECORDS;
  const ser=[...new Set(rows.map(r=>r['系列']).filter(Boolean))].sort();
  const cfg=[...new Set(rows.map(r=>r['配置']).filter(Boolean))].sort();
  const ssel=document.getElementById('fSer');
  const csel=document.getElementById('fCfg');
  ssel.innerHTML='<option value="">全部</option>'+ser.map(s=>'<option value="'+s.replace(/"/g,'&quot;')+'">'+s+'</option>').join('');
  csel.innerHTML='<option value="">全部</option>'+cfg.map(c=>'<option value="'+c.replace(/"/g,'&quot;')+'">'+c+'</option>').join('');
  ssel.value='';csel.value='';document.getElementById('kw').value='';
}

function switchDate(date){
  if(date < "2026-04-01" || date > "2029-03-31")return;
  CURRENT_DATE=date;
  if(META[date]){
    CURRENT_RECORDS=META[date].records;
    HEADERS=META[date].headers.slice();
  } else {
    const e=makeEmptySnapshot();
    CURRENT_RECORDS=e.records;
    HEADERS=e.headers;
  }
  buildHeader();
  buildFilters();
  computeKPI();
  renderTable();
}

function computeKPI(){
  const rows=CURRENT_RECORDS.filter(r=>r['物料号']!=='总计');
  const num=v=>{const n=parseFloat(String(v).replace(/,/g,''));return isNaN(n)?0:n;};
  const mtd=rows.reduce((s,r)=>s+num(r['MTD']),0);
  const lastwk=rows.reduce((s,r)=>s+num(r['上周成交']),0);
  const avg=Math.floor(lastwk/7);
  const yest=rows.reduce((s,r)=>s+num(r['昨天成交']),0);
  const stock=rows.reduce((s,r)=>s+num(r['目前可售']),0);
  const turn=lastwk?(stock/lastwk):0;
  document.getElementById('kMtd').textContent=mtd.toLocaleString();
  document.getElementById('kLastwk').textContent=lastwk.toLocaleString();
  document.getElementById('kAvg').textContent=avg.toLocaleString();
  document.getElementById('kYest').textContent=yest.toLocaleString();
  document.getElementById('kStock').textContent=stock.toLocaleString();
  document.getElementById('kTurn').textContent=turn.toFixed(1);
}

function toggleSort(i){if(sortIdx===i){sortDir=-sortDir;}else{sortIdx=i;sortDir=-1;}renderTable();}
function sortSeq(){sortIdx=-1;sortDir=1;renderTable(true);}
function resetFilter(){
  document.getElementById('kw').value='';
  document.getElementById('fSer').value='';
  document.getElementById('fCfg').value='';
  renderTable();
}

function fmtAvg(v){
  const n=parseFloat(String(v).replace(/,/g,''));
  if(isNaN(n))return v;
  return String(Math.floor(n));
}

function renderTotalRow(){
  const trow=document.getElementById('total-row');
  trow.innerHTML='';
  const total=CURRENT_RECORDS.find(r=>r['物料号']==='总计');
  if(!total){trow.style.display='none';return;}
  trow.style.display='';
  const th=document.createElement('th');
  th.textContent='总计';
  trow.appendChild(th);
  HEADERS.forEach((h,i)=>{
    const c=document.createElement('th');
    if(h==='目前可售')c.classList.add('hl');
    let tv=(total[h]===undefined)?'':total[h];
    if(h==='上周日均')tv=fmtAvg(tv);
    c.textContent=tv;
    c.title='单击复制';
    c.addEventListener('click',function(){doCopy(tv);});
    trow.appendChild(c);
  });
}

function copyToast(txt){
  const t=document.getElementById('copyToast');
  t.textContent=txt;
  t.classList.add('show');
  clearTimeout(t._tm);
  t._tm=setTimeout(function(){t.classList.remove('show');},1100);
}
function doCopy(txt){
  if(txt===undefined||txt===null||txt===''){copyToast('该单元格为空');return;}
  txt=String(txt);
  const ok=function(){copyToast('已复制：'+txt);};
  if(navigator.clipboard&&navigator.clipboard.writeText){
    navigator.clipboard.writeText(txt).then(ok).catch(function(){fallbackCopy(txt,ok);});
  } else { fallbackCopy(txt,ok); }
}
function fallbackCopy(txt,cb){
  const ta=document.createElement('textarea');
  ta.value=txt;ta.style.position='fixed';ta.style.left='-9999px';
  document.body.appendChild(ta);ta.select();
  try{document.execCommand('copy');cb();}catch(e){copyToast('复制失败，请手动选择');}
  document.body.removeChild(ta);
}

function renderTable(bySeq){
  const kw=(document.getElementById('kw').value||'').trim().toLowerCase();
  const fs=document.getElementById('fSer').value;
  const fcfg=document.getElementById('fCfg').value;
  let rows=CURRENT_RECORDS.filter(r=>r['物料号']!=='总计').slice();
  if(fs)rows=rows.filter(r=>r['系列']===fs);
  if(fcfg)rows=rows.filter(r=>r['配置']===fcfg);
  if(kw)rows=rows.filter(r=>Object.values(r).some(v=>String(v).toLowerCase().includes(kw)));
  if(bySeq){
    rows.sort((a,b)=>a._seq-b._seq);
  } else if(sortIdx>=0){
    rows.sort((a,b)=>{
      const va=a[HEADERS[sortIdx]],vb=b[HEADERS[sortIdx]];
      const na=parseFloat(String(va).replace(/,/g,''));
      const nb=parseFloat(String(vb).replace(/,/g,''));
      if(!isNaN(na)&&!isNaN(nb))return (na-nb)*sortDir;
      return String(va).localeCompare(String(vb))*sortDir;
    });
  }
  const tb=document.getElementById('tbody');
  tb.innerHTML='';
  document.getElementById('cnt').textContent=rows.length;
  if(rows.length===0){
    tb.innerHTML='<tr><td colspan="'+(HEADERS.length+1)+'" class="empty">暂无符合条件的记录</td></tr>';
    return;
  }
  rows.forEach((r,ri)=>{
    const tr=document.createElement('tr');
    const seqTd=document.createElement('td');
    seqTd.textContent=(r._seq==null||r._seq==='')?'':r._seq;
    seqTd.style.color='#9aa3bd';
    tr.appendChild(seqTd);
    HEADERS.forEach((h,i)=>{
      const td=document.createElement('td');
      if(h==='目前可售')td.classList.add('hl');
      else if(i!==0&&i!==1&&i!==2)td.className='num';
      let v=r[h]===undefined?'':r[h];
      if(h==='上周日均')v=fmtAvg(v);
      td.textContent=v;
      td.title='单击复制';
      td.addEventListener('click',function(){doCopy(v);});
      tr.appendChild(td);
    });
    tb.appendChild(tr);
  });
}
buildHeader();
buildFilters();
computeKPI();
renderTable();
</script>
<div class="zoom-box">
  <button id="z-out" title="缩小">−</button>
  <span class="zval" id="z-val">91%</span>
  <button id="z-in" title="放大">+</button>
</div>
</div>
<script>
(function(){
  var wrap=document.getElementById('zoom-wrap');
  var val=document.getElementById('z-val');
  var btnOut=document.getElementById('z-out');
  var btnIn=document.getElementById('z-in');
  var MIN=0.5,MAX=1.5,STEP=0.01,DEFAULT=0.91;
  var cur=DEFAULT;
  function apply(){
    wrap.style.zoom=cur;
    val.textContent=Math.round(cur*100)+'%';
    var atMin=(cur<=MIN+1e-6), atMax=(cur>=MAX-1e-6);
    btnOut.disabled=atMin; btnIn.disabled=atMax;
    btnOut.style.opacity=atMin?0.35:1;
    btnIn.style.opacity=atMax?0.35:1;
    try{localStorage.setItem('boardZoom',cur);}catch(e){}
  }
  try{
    var saved=parseFloat(localStorage.getItem('boardZoom'));
    if(saved>=MIN&&saved<=MAX){cur=saved;}
  }catch(e){}
  btnOut.onclick=function(){if(cur>MIN+1e-6){cur=Math.max(MIN,+(cur-STEP).toFixed(2));apply();}};
  btnIn.onclick=function(){if(cur<MAX-1e-6){cur=Math.min(MAX,+(cur+STEP).toFixed(2));apply();}};
  apply();
})();
</script>
</body>
